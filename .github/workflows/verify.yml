name: verify

concurrency:
  # Cancel superseded in-flight runs on PR branches; let main runs complete.
  #
  # The SHA is in the group ON PURPOSE. `cancel-in-progress: false` alone does
  # NOT give a merged SHA its own run: GitHub keeps at most ONE pending run per
  # concurrency group and CANCELS the previously pending one as soon as a newer
  # run enters, so on a busy main every intermediate run is superseded before a
  # runner ever picks it up. Measured 2026-08-19 in xema-base: 12 of the 12 most
  # recent runs were `cancelled`, and every one of them was a SHA already merged
  # to main — including the two commits that FIXED a red CI those runs existed to
  # report. The repo had been red since 2026-08-18T20:28 and it stayed invisible
  # because almost nothing ever completed.
  #
  # Making the group unique per SHA on main is what makes the line above true.
  # PR branches keep one shared group and still coalesce, which is what that
  # half was always for.
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # GitHub-hosted. The org's self-hosted pool cannot serve this repo: the
    # `Default` runner group has `allows_public_repositories: false`, so jobs
    # labelled [self-hosted, linux] sat queued with no runner and were expired
    # by GitHub after 24h. This job needs only Node and this repo's own files.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Manifest + template validation only. The cross-repo drift check
      # (tools/check-drift.mjs without --manifest-only) diffs the LICENSE and
      # NOTICE of every repo in repos.manifest.json and so requires them
      # checked out as siblings -- which a standalone CI checkout never has,
      # and which no available credential can produce (the org has no
      # cross-repo token, and several of those repos are private). Run the
      # full drift check from a local monorepo workspace instead.
      - name: Validate manifest and templates
        run: node tools/check-drift.mjs --manifest-only

      # `node` directly, not `npm run`: the gate is self-contained (node
      # builtins only) and must stay runnable from a bare checkout with no
      # install.
      - name: Every tracked source file is readable by search
        run: node tooling/boundaries/lib/source-readability.mjs
